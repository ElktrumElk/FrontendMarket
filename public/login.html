<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Market | Login</title>

    <link rel="stylesheet" href="/style/login.css">
</head>

<body>
    <div class="login_cnt">
        <h1>Login</h1>
        <form action="/login" method="post" autocomplete="on">

            <div class="row_cnt">
                <label for="usrname">Username</label>
                <input class="inp" name="username" id="usrname" type="text" required>
            </div>

            <div class="row_cnt">
                <label for="passwd">Password</label>
                <input class="inp" name="password" id="passwd" type="password" required>
            </div>

            <button class="submit_button" type="submit">Login</button>
            <a href="#">Forgot password</a>
        </form>

        <p class="span">If you dont yet have an account<a href="/creatAccount"> Create an Account</a></p>
    </div>
</body>

</html>
